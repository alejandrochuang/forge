stages:
  - build
  - scan
  - sign

variables:
  IMAGE_NAME: "${ACR_LOGIN_SERVER}/forge-base"
  VERSION: "0.1.0"

.sigstore_id_token:
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
    - docker buildx create --name forgebuilder --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --file Dockerfile.base \
        --tag "${IMAGE_NAME}:${VERSION}" \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg VCS_REF="${CI_COMMIT_SHORT_SHA}" \
        --build-arg GITLAB_USER="alejandrochuang" \
        --provenance=true \
        --metadata-file metadata.json \
        --push \
        .
      DIGEST=$(grep -o '"containerimage.digest": *"[^"]*"' metadata.json | grep -o 'sha256:[a-f0-9]*')
      echo "Digest capturado: '${DIGEST}'"
      if [ -z "$DIGEST" ]; then echo "ERROR: digest vacio"; exit 1; fi
      echo "DIGEST=${DIGEST}" > build.env
      cat build.env
  artifacts:
    reports:
      dotenv: build.env

scan:
  stage: scan
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore "${IMAGE_NAME}@${DIGEST}"

sbom:
  stage: scan
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
  script:
    - syft "${IMAGE_NAME}@${DIGEST}" -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 30 days

sign:
  stage: sign
  extends: .sigstore_id_token
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64" -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    - cosign version
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
  script:
    - cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
