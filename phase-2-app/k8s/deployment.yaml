apiVersion: apps/v1
kind: Deployment
metadata:
  name: securityscanservice
  namespace: forge
  labels:
    app: securityscanservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securityscanservice
  template:
    metadata:
      labels:
        app: securityscanservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: forgeacr8140.azurecr.io/forge-app:0.1.0
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
