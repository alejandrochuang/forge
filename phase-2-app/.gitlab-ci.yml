stages:
  - build
  - scan
  - sign

variables:
  IMAGE_NAME: "${ACR_LOGIN_SERVER}/forge-app"
  VERSION: "0.1.0"

.sigstore_id_token:
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore

# Plantilla comun: docker:27 (tiene shell) + login al ACR para leer la imagen por digest
.docker_base:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl bash
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  retry:
    max: 2
    when:
      - runner_system_failure
      - script_failure
  before_script:
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
    - docker buildx create --driver docker-container --name forgebuilder --driver-opt network=host --use
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --file Dockerfile \
        --build-arg ACR_LOGIN_SERVER="${ACR_LOGIN_SERVER}" \
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg VCS_REF="${CI_COMMIT_SHORT_SHA}" \
        --tag "${IMAGE_NAME}:${VERSION}" \
        --provenance=true \
        --sbom=true \
        --push \
        .
    - |
      RAW=$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{.Manifest.Digest}}')
      DIGEST=$(printf '%s\n' "$RAW" | grep -oE 'sha256:[a-f0-9]{64}' | sed -n '1p')
      if [ -z "$DIGEST" ]; then
        echo "ERROR: no se pudo extraer el digest de: $RAW"
        exit 1
      fi
      printf 'DIGEST=%s\n' "$DIGEST" > build.env
      echo "--- build.env ---"
      cat build.env
  artifacts:
    reports:
      dotenv: build.env

trivy-scan:
  stage: scan
  extends: .docker_base
  script:
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore "${IMAGE_NAME}@${DIGEST}"

sbom:
  stage: scan
  extends: .docker_base
  script:
    - curl -sSfL https://get.anchore.io/syft | sh -s -- -b /usr/local/bin
    - syft "${IMAGE_NAME}@${DIGEST}" -o cyclonedx-json=sbom-app.cdx.json
  artifacts:
    paths:
      - sbom-app.cdx.json
    expire_in: 30 days

sign:
  stage: sign
  extends: .sigstore_id_token
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
    - curl -sfL "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64" -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
  script:
    - cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

attest-sbom:
  stage: sign
  extends: .sigstore_id_token
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - job: build
      artifacts: true
    - job: trivy-scan    # <- el gate, explícito
    - job: sbom
      artifacts: true
  before_script:
    - apk add --no-cache curl
    - echo "$ARM_CLIENT_SECRET" | docker login "$ACR_LOGIN_SERVER" -u "$ARM_CLIENT_ID" --password-stdin
    - curl -sfL "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64" -o /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
  script:
    - cosign attest --yes --predicate sbom-app.cdx.json --type cyclonedx "${IMAGE_NAME}@${DIGEST}"
